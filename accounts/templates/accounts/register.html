<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro — Parqueando Ando</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #eef4ff 0%, #f8f9fa 55%);
        }
        .login-card { border: none; border-radius: 1.25rem; }
        .login-logo { font-size: 2.4rem; line-height: 1; }
        .helptext { display: block; font-size: 0.8rem; color: #6c757d; margin-top: 0.25rem; }
        ul.errorlist { list-style: none; padding-left: 0; color: #dc3545; font-size: 0.875em; margin-bottom: 0; }
    </style>
</head>
<body class="d-flex align-items-center">
    <main class="container py-5" style="max-width: 440px;">
        <div class="card login-card shadow">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="login-logo mb-2">🚗</div>
                    <h1 class="h4 mb-1">Crea tu cuenta</h1>
                    <p class="text-muted small mb-0">Parqueando Ando · EAFIT</p>
                </div>

                <form method="post" novalidate>
                    {% csrf_token %}
                    
                    {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                        <input type="{{ field.field.widget.input_type }}" 
                               name="{{ field.html_name }}"
                               id="{{ field.id_for_label }}"
                               class="form-control {% if field.errors %}is-invalid{% endif %}"
                               {% if field.field.required %}required{% endif %}>
                        
                        {% if field.help_text %}
                        <small class="helptext">{{ field.help_text|safe }}</small>
                        {% endif %}
                        
                        {% for error in field.errors %}
                        <div class="invalid-feedback d-block">{{ error }}</div>
                        {% endfor %}
                    </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">Registrarse</button>
                </form>

                <div class="text-center mt-4 small">
                    <p class="mb-2">¿Ya tienes cuenta? <a href="{% url 'accounts:login' %}">Inicia sesión</a></p>
                    <a href="{% url 'home' %}" class="text-muted">&larr; Volver al inicio</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
